# Run the suite against each supported Django on the Pythons it supports.
# `tox` runs everything installed locally (missing Pythons are skipped);
# `tox -e py313-django52` runs one; extra args go to runtests.py, e.g.
# `tox -e py313-django61 -- tests.test_writes`.
[tox]
envlist =
    py{310,311,312}-django42
    py{310,311,312,313,314}-django52
    py{312,313,314}-django61
skip_missing_interpreters = true

[testenv]
deps =
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<6.0
    django61: Django>=6.1,<6.2
commands = python runtests.py {posargs}
